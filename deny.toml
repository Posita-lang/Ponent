# This template contains all of the possible sections and their default values

# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note
# will be

# The values provided in this template are the default values that will be used
# when any section or field is not specified in your own configuration

# Root options
[graph]
targets = [
    #"x86_64-unknown-linux-musl",
    #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─────────────────────────────────────────────────────────────────────────────
# Advisory checks — vulnerability auditing
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
# Two unmaintained-crate advisories are dev-only transitive deps with no
# upstream fix available (upstream explicitly says "No safe upgrade").
# Default unused-ignored-advisory = "warn": when the upstream chain no
# longer pulls them in, an unused-ignore warning prompts us to delete.
ignore = [
    # flowlog-runtime -> timely -> bincode
    { id = "RUSTSEC-2025-0141", reason = "bincode permanently unmaintained; dev-only transitive dep (timely), no fix version upstream" },
    # flowlog-runtime -> differential-dataflow -> columnation -> paste
    { id = "RUSTSEC-2024-0436", reason = "paste archived; dev-only transitive dep (columnation/differential-dataflow), no fix version upstream" },
]

# ─────────────────────────────────────────────────────────────────────────────
# License checks — only allow permissive, open-source licenses
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # xxhash-rust (direct dep, content fingerprints): Boost license, very permissive.
    "BSL-1.0",
    # as_variant (direct dep, SmallBox storage): file-level weak copyleft, OSI/FSF approved.
    "MPL-2.0",
    # webpki-roots (reqwest/rustls TLS chain): license of root CA cert data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # e.g. { allow = ["Zlib"], crate = "adler32" },
]

#[[licenses.clarify]]
#crate = "ring"
#expression = "MIT AND ISC AND OpenSSL"
#license-files = [
#    { path = "LICENSE", hash = 0xbd0eed23 }
#]

[licenses.private]
ignore = false
registries = []

# ─────────────────────────────────────────────────────────────────────────────
# Ban checks — crate blacklist, duplicate version detection
# ─────────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"   # Warn if same crate appears at multiple versions
wildcards = "deny"           # Deny wildcard version requirements
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false

# Force rustls over openssl — deny openssl entirely
deny = [
    { crate = "openssl", reason = "prefer rustls for TLS — smaller, safer, no C dependency" },
    { crate = "openssl-sys", reason = "prefer rustls for TLS — smaller, safer, no C dependency" },
    { crate = "openssl-src", reason = "prefer rustls for TLS — smaller, safer, no C dependency" },
]

# Skip the stale transitive duplicate copies (keep the new/direct one);
# these come from third-party version matrices we don't control.
skip = [
    # reqwest's old path pulls 0.22; direct dep is 0.23.
    { name = "base64", version = "0.22" },
    # small-map pulls 0.16; indexmap pulls 0.17.
    { name = "hashbrown", version = "0.16" },
    # legacy derive ecosystem still on syn 2; wait for upstream to migrate.
    { name = "syn", version = "2.0" },
    # ring pins 0.52.
    { name = "windows-sys", version = "0.52" },
]
skip-tree = []

# ─────────────────────────────────────────────────────────────────────────────
# Source checks — only allow crates.io and approved git repos
# ─────────────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []