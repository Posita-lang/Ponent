name: Pull Request Documentation Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  pull-requests: write

concurrency:
  group: pr-documentation-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    name: Synchronize documentation label
    runs-on: ubuntu-latest
    steps:
      # Use only trusted workflow code and GitHub API metadata. Never check out
      # or execute code from the pull request, including fork-originated PRs.
      - name: Add or remove only the documentation label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid pull request number: ${issue_number}`);
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: issue_number,
                per_page: 100,
              },
            );

            // GitHub caps this endpoint at 3,000 files. At the cap we cannot
            // prove that the returned list is complete, so leave the current
            // label untouched rather than incorrectly removing it.
            if (files.length >= 3000) {
              core.warning(
                "Skipping documentation-label synchronization: GitHub's PR files API returned its 3,000-file limit.",
              );
              return;
            }

            const isDocumentationPath = (path) =>
              path.endsWith(".md") ||
              path.startsWith("docs/") ||
              path === ".github/ISSUE_TEMPLATE.md" ||
              path === ".github/PULL_REQUEST_TEMPLATE.md" ||
              path.startsWith(".github/ISSUE_TEMPLATE/") ||
              path.startsWith(".github/PULL_REQUEST_TEMPLATE/");

            // Include previous_filename so a rename out of a documentation
            // path remains classified as a documentation change.
            const hasDocumentationChanges = files.some((file) =>
              [file.filename, file.previous_filename]
                .filter((path) => typeof path === "string")
                .some(isDocumentationPath),
            );

            if (hasDocumentationChanges) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ["documentation"],
              });
              core.info("Applied the documentation label.");
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: "documentation",
              });
              core.info("Removed the stale documentation label.");
            } catch (error) {
              // A missing label is already the desired state. Surface every
              // other API failure so permission/configuration errors are clear.
              if (error.status !== 404) throw error;
              core.info("The documentation label was not present; nothing to remove.");
            }
