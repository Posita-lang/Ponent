name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Z3 (loop-variable tests)
        run: sudo apt-get update && sudo apt-get install -y z3
      - run: cargo check --workspace --locked
      - run: cargo check --workspace --all-features --locked
      - run: cargo xtask codegen --check
      - run: cargo xtask site --out target/error_codes_site
      - run: cargo test --workspace --features omniml_pool,slow-tests --locked
      - run: cargo test --features shuttle --locked
      # Release-mode type check: several diagnostics paths differ by `cfg`
      # (`debug_assert` tripwires disappear, `#[cfg(not(debug_assertions))]` release
      # clamps appear).  A debug-only matrix compiled none of the latter, which is how
      # a release-only break (the `i18n` macro arity, the `explain` capacity) shipped
      # past green CI.
      - run: cargo check --release --bin ponent --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --locked

  cross-platform:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo check --workspace --locked
      - run: >-
          cargo test --bin ponent --locked --
          --skip test_loop_vars_collected_from_assign_bodies

  # The NEON tier (`src/diagnostics/ascii.rs`) and the aarch64-only paths are
  # otherwise never compiled: `cross-platform` covers macOS/Windows on x86, and
  # nothing in the default matrix builds for a non-x86 architecture.  A
  # type-check on aarch64 is the cheapest way to keep that code from rotting
  # between the rare reports of a NEON-specific break.
  #
  # wasm32 is deliberately **not** here: `z3 = { features = ["vendored"] }` needs
  # a C++ toolchain for the target, and there is none for
  # `wasm32-unknown-unknown`, so the check dies in `z3-sys`'s build script before
  # any of this crate compiles.  Fixing that needs a non-vendored or feature-gated
  # z3, not a CI line.
  # A 32-bit target compiles the *fallback* tier (`classify_word8`,
  # `classify_swar_wide`) and every `usize`-width assumption (`u32::MAX/4` guards,
  # `SmallVec` inline sizes) with a different word size.  Nothing else in the matrix
  # does: the OS matrix is x86_64-only and the aarch64 job is 64-bit.
  cross-i686:
    name: Check (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: i686
      # z3 is `vendored`, so its C/C++ sources need a 32-bit toolchain too.
      - run: sudo apt-get update && sudo -A apt-get install -y gcc-multilib g++-multilib
      - run: cargo check --bin ponent --locked --target i686-unknown-linux-gnu
        env:
          CC_i686_unknown_linux_gnu: gcc
          CXX_i686_unknown_linux_gnu: g++

  cross-aarch64:
    name: Check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      # z3 is `vendored`, so the C/C++ sources must be cross-compiled too; the
      # crate's build script probes for `aarch64-linux-gnu-gcc`.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: cargo check --bin ponent --locked --target aarch64-unknown-linux-gnu
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

  # `cross-aarch64` only *compiles* the NEON tier.  The overlap-tail bug in
  # `next_non_ascii_byte` (NEON and wasm never had the masked tail the x86
  # kernels do — their tail was the re-dispatch that the x86 cleanup deleted) was
  # a silent wrong answer, not a build error: no amount of type-checking would
  # have caught it.  So the aarch64 leg also *executes* the ascii tests under
  # qemu, which is the only way the NEON kernels run in CI at all.
  #
  # Scope is deliberately the `ascii` tests only.  They are the only suite whose
  # behaviour is architecture-selected (`#[cfg(target_arch)]` + `#[target_feature]`
  # tiers); the rest is arch-agnostic and already runs on x86.  Running all ~2.5k
  # tests under qemu would multiply the job's wall clock for no extra coverage.
  #
  # wasm32 still cannot run here: `z3 = { features = ["vendored"] }` needs a C++
  # toolchain for the target and none exists for `wasm32-unknown-unknown`
  # (documented at `cross-platform` above).  The wasm tail arithmetic and its
  # `bitmask & !((1 << skip) - 1)` mask are therefore covered on x86 by
  # `ascii::tests::tail_overlap_16_and_its_masks_cover_every_remainder`, which
  # re-derives both backends' masks from the same `skip`.
  test-aarch64:
    name: Test (aarch64, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-test
      - run: sudo apt-get update && sudo -A apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
      - run: cargo test --bin ponent --locked --target aarch64-unknown-linux-gnu -- ascii
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          # `-L` supplies the aarch64 loader and libc for the dynamically linked
          # test binary; without it qemu exits with ENOENT on the interpreter.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu

  # Target *checks* for the backends an x86 runner cannot see.
  #
  # Every backend in `diagnostics/ascii.rs` is `#[cfg(target_arch = ...)]`, so an x86
  # job compiles none of them.  The wasm `next_non_ascii_byte` tail once shipped
  # containing aarch64 intrinsics (`vld1q_u8`, `LANE_IDX`, `first_high_lane`) — the
  # wasm backend had never compiled and nothing said so.  `cargo check` does not link,
  # so each of these costs seconds.
  #
  # aarch64 is blocking: the target's libs come from rustup and no C/C++ toolchain is
  # needed for `check`.
  check-aarch64:
    name: Check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-check
      - run: cargo check --bin ponent --locked --target aarch64-unknown-linux-gnu

  # wasm32 is **advisory** until the `z3 = { features = ["vendored"] }` C++ blocker
  # below is resolved: the dependency graph cannot be built for the target at all, so
  # a failing check says nothing about this crate's wasm code.  `continue-on-error`
  # keeps the job informative (it prints the blocker) without gating PRs on a
  # dependency we cannot cross-build; when that lands, delete the flag and the
  # `ascii.rs` wasm backend is covered from that day on.
  check-wasm32:
    name: Check (wasm32, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-check
      - run: cargo check --bin ponent --locked --target wasm32-unknown-unknown

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pins the `rust-version` floor in Cargo.toml.  The floor is set by
      # the newest feature the tree actually uses, not by preference, so
      # this job is what makes an accidental MSRV-raising edit visible
      # (cargo refuses the toolchain with "requires rustc X").  It does
      # NOT try to run the whole suite: `slow-tests` needs ~17 min and
      # `shuttle` needs a scheduler-aware build.  `cargo check` is enough
      # to prove the syntax/library floor.
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny — advisory, license, ban, and source checks
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  lean:
    name: Lean (UnderlineLanes)
    runs-on: ubuntu-latest-8core
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Guard toolchain alignment
        run: |
          set -euo pipefail
          cd research/underline-lanes/lean
          want="$(cat lean-toolchain)"
          echo "project lean-toolchain : $want"
          case "$want" in
            *:v4.36.0) echo "toolchain pinned to release v4.36.0 OK" ;;
            *) echo "::error::unexpected lean-toolchain $want, expected release v4.36.0"; exit 1 ;;
          esac

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/underline-lanes/lean
          use-github-cache: true
          use-mathlib-cache: true
          build-args: "--quiet"
        env:
          LEAN_NUM_THREADS: "2"

  benchmark:
    name: Benchmarks (measurement data)
    runs-on: ubuntu-latest
    # These numbers are *data*, not gates.  Two decisions in the tree are
    # explicitly waiting on them:
    #   * `ascii.rs`'s dispatch tiers (`AVX512_MIN_LEN`, the `< 16` scalar tail)
    #     and the four-class kernel tax on single-predicate callers — the file's
    #     own comment calls them measurement decisions;
    #   * `wrap_dp`'s Larmore–Schieber crossover (`n* ≈ 10–15` words) — the code
    #     comment derives it, nothing measures it.
    # Wall-clock assertions are deliberately absent: shared runners are far too
    # noisy to gate on, so the job prints numbers into the log and the reviewer
    # compares them against the recorded analysis.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: ASCII dispatch boundaries (vector vs SWAR)
        run: cargo bench --bench ascii_dispatch --features bench-hooks
      - name: Diagnostic hot paths (ignored measurement probes)
        # Scoped to `diagnostics::` so the query-engine perf probes (12 ignored
        # tests under `hir::query::defense_tests`) do not run in this job.
        # Includes `perf_wrap_optimal`, the only measurement of the
        # Larmore-Schieber crossover (`n* ~ 10-15` words) the wrap comment
        # derives but does not measure.
        run: >
          cargo test --bin ponent --release --locked --
          --ignored --nocapture --test-threads=1 diagnostics::
      - name: ASCII dispatch at the decision lengths
        # The kernel thresholds are tuned at exactly these lengths: the tier
        # boundaries (16/32/64/128) plus the lengths the overlap tails changed
        # (65, 129, 257).  Kept separate from the full sweep above so the numbers
        # a reviewer reads are the ones the constants are decided at.
        run: >
          cargo bench --bench ascii_dispatch --features bench-hooks --
          'ascii_dispatch/(classify|predicates)/printable/(16|32|40|48|56|64|65|72|96|112|128|129|255|256|257)$'
      - name: Summarise criterion medians
        # Machine-readable, so two runs can be diffed without reading logs.  The
        # medians land in the step summary *and* in the uploaded artifact.
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          rows = []
          for path in glob.glob("target/criterion/**/new/estimates.json", recursive=True):
              parts = path.split(os.sep)
              name = "/".join(parts[2:-2])
              median = json.load(open(path))["median"]["point_estimate"]
              base = path.replace(os.sep + "new" + os.sep, os.sep + "base" + os.sep)
              delta = ""
              try:
                  b = json.load(open(base))["median"]["point_estimate"]
                  delta = f"{(median - b) / b * 100:+.1f}%"
              except Exception:
                  pass
              rows.append((name, median, delta))
          print("| benchmark | median ns | vs base |")
          print("|---|---|---|")
          for name, median, delta in sorted(rows):
              print(f"| {name} | {median:.3f} | {delta} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: target/criterion
          retention-days: 30
