name: Pull Request Size Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: pr-size-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Classify diff size
    runs-on: ubuntu-latest
    steps:
      # No checkout is performed: the workflow uses only trusted inline code and
      # GitHub API metadata. This also permits safe labeling of fork-originated PRs.
      - name: Apply size label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              throw new Error(`Invalid pull request number: ${issue_number}`);
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });

            const additions = pull.additions;
            const deletions = pull.deletions;
            if (
              !Number.isSafeInteger(additions) ||
              additions < 0 ||
              !Number.isSafeInteger(deletions) ||
              deletions < 0
            ) {
              throw new Error("GitHub returned invalid PR additions/deletions metadata.");
            }

            // Size is the total changed-line count (additions + deletions), not
            // the number of files. Thresholds are exclusive upper bounds.
            const changedLines = additions + deletions;
            const buckets = [
              { max: 10, name: "size/XS", color: "C2E0C6", description: "0–9 changed lines" },
              { max: 50, name: "size/S", color: "A5D6A7", description: "10–49 changed lines" },
              { max: 200, name: "size/M", color: "FEF2C0", description: "50–199 changed lines" },
              { max: 500, name: "size/L", color: "F9D0C4", description: "200–499 changed lines" },
              { max: 1000, name: "size/XL", color: "E99695", description: "500–999 changed lines" },
              { max: Number.POSITIVE_INFINITY, name: "size/XXL", color: "B60205", description: "1,000 or more changed lines" },
            ];

            const selected = buckets.find(({ max }) => changedLines < max);
            if (!selected) {
              throw new Error(`No size bucket matched ${changedLines} changed lines.`);
            }

            // Ensure the selected label exists. Handle a concurrent workflow
            // creating the same label by accepting 422 only if it now exists.
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: selected.name,
                color: selected.color,
                description: selected.description,
              });
            } catch (error) {
              if (error.status !== 422) throw error;

              const repositoryLabels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: 100 },
              );
              if (!repositoryLabels.some(({ name }) => name === selected.name)) {
                throw error;
              }
            }

            // Add the new label before removing stale managed labels. If a
            // removal fails, a later run can safely converge to one label.
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [selected.name],
            });

            const currentLabels = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              { owner, repo, issue_number, per_page: 100 },
            );

            for (const label of currentLabels) {
              if (
                label.name.startsWith("size/") &&
                label.name !== selected.name
              ) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number,
                    name: label.name,
                  });
                } catch (error) {
                  // Another run or a maintainer may have removed it already.
                  if (error.status !== 404) throw error;
                }
              }
            }

            core.info(
              `Applied ${selected.name}: ${changedLines} changed lines (${additions} additions, ${deletions} deletions).`,
            );
