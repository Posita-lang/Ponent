name: Greetings

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: first-interaction-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  greet:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    steps:
      # The action posts only for a contributor's first issue or first PR.
      # Do not check out or execute code from the triggering contribution.
      - name: Greet first-time contributor
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d
        with:
          issue_message: |
            Thank you for opening your first issue in Ponent!

            We appreciate your interest. Please include the relevant context, expected behavior, actual behavior, and a minimal reproduction when applicable. For correctness or safety-sensitive reports, please also identify the affected invariant or guarantee if known.
          pr_message: |
            Thank you for your first pull request to Ponent!

            We appreciate the contribution. Please ensure the PR explains its motivation, relevant design decisions, and verification performed. For changes affecting correctness, ownership, concurrency, or safety guarantees, include the invariants considered and the evidence supporting the change.
